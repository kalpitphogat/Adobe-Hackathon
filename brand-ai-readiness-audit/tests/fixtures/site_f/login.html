<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — DevTools Forge</title>
<meta name="description" content="Log in to your DevTools Forge account to sync saved tool settings across devices.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://devtools-forge.test/login">
</head>
<body>
<header>
  <a href="/">DevTools Forge</a>
</header>

<main>
  <h1>Log in</h1>
  <form action="/session" method="post">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
  <p><a href="/">Back to the tools</a></p>
</main>

<footer>
  <a href="/docs/getting-started">Docs</a>
  <p>&copy; 2026 DevTools Forge Ltd, 8 Rivergate, Bristol BS1 6EH.</p>
</footer>
</body>
</html>
